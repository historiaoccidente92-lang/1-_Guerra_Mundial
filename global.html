<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Primera Guerra Mundial, 1914–1918</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="globe" aria-label="Globo terráqueo 3D interactivo"></div>
<div id="map" aria-label="Mapa mundial 2D interactivo"></div>

<div class="bar">
  <h1>La Primera Guerra Mundial<small>Arrastra el globo y haz clic en un país</small></h1>
  <label>Año
    <select id="year" aria-label="Seleccionar año"></select>
  </label>
  <button id="surveyOpen">Encuesta</button>
  <button id="view">Vista 2D</button>
  <button id="infl" aria-pressed="false">Colorear por influencia</button>
  <button id="bando" aria-pressed="false">Colorear por bando</button>
</div>

<div class="legend" id="legend">
  <span><i style="background:var(--hi)"></i>Muy influyente</span>
  <span><i style="background:var(--mid)"></i>Influencia media</span>
  <span><i style="background:var(--lo)"></i>Poco influyente</span>
</div>

<aside class="card" id="events">
  <h2 id="evTitle"></h2>
  <p id="evSub"></p>
  <button id="evOpen">Ver el año en detalle</button>
</aside>

<aside class="card" id="info" aria-live="polite">
  <h2>Selecciona un país</h2>
  <p>Haz clic en cualquier país del globo para ver qué ocurrió allí en el año elegido.</p>
</aside>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
 <div class="mbox">
  <header>
   <div><h2 id="mTitle"></h2><span class="tag" id="mTag"></span></div>
   <div class="tabs" id="mYears" role="group" aria-label="Año"></div>
   <button id="mClose" aria-label="Cerrar">Cerrar ✕</button>
  </header>
  <div class="mbody">
   <section>
    <p id="mNote" style="color:var(--mid)"></p><h3 id="mYearH"></h3><p id="mText"></p><div id="mExtra"></div>
    <button id="mToYear"></button>
   </section>
   <section><h3>Videos</h3><div id="mVideos"></div></section>
  </div>
 </div>
</div>

<div class="modal" id="ymodal" hidden role="dialog" aria-modal="true" aria-labelledby="yTitle">
 <div class="mbox">
  <header>
   <div><h2 id="yTitle"></h2></div>
   <div class="tabs" id="yYears" role="group" aria-label="Año"></div>
   <button id="yClose" aria-label="Cerrar">Cerrar ✕</button>
  </header>
  <div class="mbody">
   <section>
    <h3 id="yWorldH"></h3><div id="yWorld"></div>
    <h3>Hechos clave del año</h3><ul id="yList"></ul>
   </section>
   <section><h3>Videos</h3><div id="yVideos"></div></section>
  </div>
 </div>
</div>

<div class="modal" id="smodal" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
 <div class="mbox sm">
  <header><h2 id="sTitle">Encuesta</h2><button id="sClose" aria-label="Cerrar">Cerrar ✕</button></header>
  <div class="mbody">
   <form id="sForm" novalidate>
    <label class="full">Tu nombre (opcional)<input id="sNombre" maxlength="80" autocomplete="name"></label>
    <label>¿Cuál fue una de las principales causas que provocó el inicio de la Primera Guerra Mundial?
      <select id="p1" required><option value="">Elige…</option><option value="A">La independencia de las colonias africanas.</option><option value="B">El asesinato del archiduque Francisco Fernando de Austria.</option><option value="C">La caída del Imperio romano</option><option value="D">La Revolución rusa.</option><option value="E">La invasión alemana a Polonia.</option></select></label>
    <label>¿Qué acontecimiento desencadenó directamente la Primera Guerra Mundial?
      <select id="p2" required><option value="">Elige…</option><option value="A">La invasión alemana de Polonia</option><option value="B">La Revolución rusa</option><option value="C">El asesinato del archiduque Francisco Fernando</option><option value="D">La caída del Imperio otomano</option><option value="E">La invasión de Bélgica por Francia</option></select></label>
    <label>¿Qué objetivo tenía Alemania con el Plan Schlieffen?
      <select id="p3" required><option value="">Elige…</option><option value="A">Invadir Rusia antes que Francia</option><option value="B">Derrotar rápidamente a Francia atravesando Bélgica y luego concentrarse en Rusia</option><option value="C">Conquistar los territorios británicos en África</option><option value="D">Bloquear los puertos británicos con submarinos</option></select></label>
    <label>¿Qué importancia tuvo la batalla de Verdún (1916)?
      <select id="p4" required><option value="">Elige…</option><option value="A">Permitió la rendición inmediata de Alemania.</option><option value="B">Marcó la entrada de Estados Unidos en la guerra.</option><option value="C">Fue una de las batallas más largas y sangrientas, demostrando el desgaste de la guerra de trincheras.</option><option value="D">Provocó la caída del Imperio austrohúngaro.</option><option value="E">Terminó definitivamente con el frente occidental.</option></select></label>
    <label>¿Por qué la salida de Rusia de la Primera Guerra Mundial benefició militarmente a Alemania?
      <select id="p5" required><option value="">Elige…</option><option value="A">Porque Rusia entregó sus colonias a Alemania.</option><option value="B">Porque Alemania pudo concentrar más tropas en el frente occidental.</option><option value="C">Porque Francia abandonó la guerra.</option><option value="D">Porque Inglaterra perdió su flota naval.</option><option value="D">Porque Estados Unidos decidió retirarse.</option></select></label>
    <label>¿Cuál fue el principal motivo por el que Estados Unidos decidió entrar en la Primera Guerra Mundial en 1917?  
      <select id="p6" required><option value="">Elige…</option><option value="A">La invasión alemana a territorio estadounidense.</option><option value="B">La alianza militar entre Estados Unidos y Rusia.</option><option value="C">El hundimiento de barcos por submarinos alemanes y el telegrama Zimmermann.</option><option value="D">La ocupación alemana de Francia.</option><option value="E">El asesinato del presidente estadounidense.</option></select></label>
    <label>¿Qué estableció principalmente el Tratado de Versalles de 1919 respecto a Alemania?
      <select id="p7" required><option value="">Elige…</option><option value="A">La expansión de sus territorios en Europa.</option><option value="B">Su incorporación a la Triple Entente.</option><option value="C">La eliminación de todas las sanciones económicas.</option><option value="D">La aceptación de responsabilidad por la guerra, el pago de reparaciones y la reducción de su ejército.</option><option value="E">La división de Alemania entre Francia e Inglaterra.</option></select></label>
    <label>¿Cuál fue una de las principales consecuencias políticas de la Primera Guerra Mundial?
      <select id="p8" required><option value="">Elige…</option><option value="A">El fortalecimiento de todos los imperios europeos.</option><option value="B"> La desaparición de los imperios alemán, austrohúngaro, ruso y otomano.</option><option value="C">La unificación de todos los países europeos.</option><option value="D">La desaparición del capitalismo.</option><options value="E">El inicio inmediato de la Guerra Fría.</options></select></label>
     <label class="full">Pregunta general (opcional)<textarea id="sComent" maxlength="500"></textarea></label>
    <button type="submit" id="sEnviar" class="full">Enviar respuestas</button>
    <p id="sMsg" class="full" role="status"></p>
   </form>
  </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="datos.js"></script>
<script src="bando.js"></script>
<script src="mapa.js"></script>
<script src="encuesta.js"></script>
</body>
</html>
